site_name: Walkway SaaS Backend Documentation
site_url: https://Walkway-ai.github.io/price_push_doc/
site_description: Complete documentation for Walkway SaaS Backend features
site_author: Walkway Team
repo_url: https://github.com/Walkway-ai/price_push_doc
repo_name: Walkway-ai/price_push_doc

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    # xola.md is ~480 lines and backend-handover.md ~745; without a visible
    # table of contents the only way to find a section is to scroll.
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - tags

markdown_extensions:
  # Permalinks: every heading gets a ¶ anchor, so a section can be pasted into
  # Slack rather than described.
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - footnotes
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Price Push Feature:
      - Overview: price-push/overview.md
      - How It Works: price-push/how-it-works.md
      - Configuration Guide: price-push/configuration.md
      - Price Unit Management: price-push/price-units.md
      - Availability Management: price-push/availability.md
      - Price Change History: price-push/history.md
      - Undo & Revert Changes: price-push/undo.md
      - Use Cases: price-push/use-cases.md
      - API Endpoints: price-push/api-endpoints.md
      - Troubleshooting: price-push/troubleshooting.md
  - Integrations:
      - Overview: integrations/index.md
      - Ventrata: integrations/ventrata.md
      - Bokun: integrations/bokun.md
      - Xola: integrations/xola.md
      - Prioticket: integrations/prioticket.md
  - Features:
      - Compsets at the subscription grain (soft release): features/compset-subscription-grain.md
      - Time-slot exclusions (ENG-2584): features/price-push-slot-exclusions.md
      - Billing accounts and Stripe customers: features/billing-accounts.md
      - Market Intelligence Access Flag: features/market-intelligence-access-flag.md
  - Operations:
      - Backend Handover Runbook: operations/backend-handover.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/walkway
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/walkway
  analytics:
    provider: google
    property: UA-XXXXXXXX-X

copyright: Copyright &copy; 2025 Walkway

